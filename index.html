<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人主页 · 石室东区</title>
    <!-- 字体与图标库 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* 全局重置 & 基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e2da 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* 主卡片 — 毛玻璃质感 */
        .card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 56px;
            padding: 50px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        /* 头部：校名 + 身份 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(180, 130, 100, 0.25);
            padding-bottom: 22px;
        }

        .school-badge {
            display: flex;
            flex-direction: column;
        }

        .school-name {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #3d2c1e;
            background: linear-gradient(135deg, #7b5e44, #a67b5b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .school-sub {
            font-size: 16px;
            color: #6b5a4a;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.5px;
            background: rgba(160, 130, 100, 0.12);
            padding: 2px 16px 2px 12px;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(4px);
            -webkit-text-fill-color: #5a4a3a;
        }

        .student-tag {
            background: rgba(90, 70, 50, 0.10);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 500;
            color: #3f2f20;
            border: 1px solid rgba(160, 130, 100, 0.20);
            backdrop-filter: blur(4px);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .student-tag i {
            color: #a67b5b;
            font-size: 18px;
        }

        /* ---- 图片区域 (显眼!) ---- */
        .hero-image-section {
            width: 100%;
            margin-bottom: 44px;
            border-radius: 40px;
            overflow: hidden;
            background: #dcd0c4;
            box-shadow: 0 12px 32px rgba(90, 60, 40, 0.15);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        .hero-image-section:hover {
            transform: scale(1.003);
            box-shadow: 0 20px 44px rgba(80, 55, 35, 0.20);
        }

        .hero-image-section img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 7;
            object-fit: cover;
            background: #c5b5a5;
        }

        .hero-image-section .img-fallback-label {
            position: absolute;
            bottom: 18px;
            right: 24px;
            background: rgba(30, 20, 12, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 22px;
            border-radius: 60px;
            color: #f2ebe4;
            font-size: 14px;
            letter-spacing: 0.5px;
            font-weight: 400;
            border: 1px solid rgba(255, 215, 180, 0.2);
            pointer-events: none;
        }

        .hero-image-section .img-fallback-label i {
            margin-right: 10px;
            color: #eaceb0;
        }

        /* 爱好展示网格 */
        .hobbies-title {
            font-size: 20px;
            font-weight: 600;
            color: #3d2c1e;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: 0.3px;
        }

        .hobbies-title i {
            color: #a67b5b;
            font-size: 24px;
        }

        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .hobby-item {
            background: rgba(245, 238, 230, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 28px 20px 26px;
            text-align: center;
            border: 1px solid rgba(255, 245, 235, 0.6);
            box-shadow: 0 6px 18px rgba(100, 75, 55, 0.06);
            transition: all 0.2s ease;
        }

        .hobby-item:hover {
            background: rgba(250, 242, 234, 0.75);
            transform: translateY(-5px);
            box-shadow: 0 16px 32px rgba(100, 75, 55, 0.10);
            border-color: rgba(200, 165, 130, 0.3);
        }

        .hobby-icon {
            font-size: 44px;
            color: #7b5e44;
            margin-bottom: 14px;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(80, 55, 30, 0.08));
        }

        .hobby-name {
            font-size: 26px;
            font-weight: 700;
            color: #2f2016;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .hobby-desc {
            font-size: 15px;
            color: #5f4c3a;
            font-weight: 400;
            opacity: 0.85;
            line-height: 1.5;
            margin-top: 6px;
        }

        .hobby-desc i {
            margin: 0 4px;
            color: #a67b5b;
            font-size: 13px;
        }

        /* ---- 社交链接区域 (新增 GitHub) ---- */
        .social-links {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 2px solid rgba(180, 130, 100, 0.20);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 40px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 28px;
            border-radius: 60px;
            background: rgba(245, 238, 230, 0.50);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 175, 150, 0.25);
            color: #3d2c1e;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .social-link:hover {
            background: rgba(250, 242, 234, 0.80);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(100, 75, 55, 0.10);
            border-color: rgba(180, 145, 115, 0.4);
        }

        .social-link i {
            font-size: 24px;
            color: #7b5e44;
        }

        .social-link .link-label {
            font-size: 15px;
        }

        .social-link .link-domain {
            font-size: 13px;
            opacity: 0.6;
            font-weight: 400;
            margin-left: 4px;
        }

        /* 底部签名 */
        .footer-note {
            margin-top: 32px;
            text-align: center;
            color: #7b6a5a;
            font-size: 15px;
            padding-top: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            letter-spacing: 0.3px;
        }

        .footer-note span {
            background: rgba(200, 175, 150, 0.10);
            padding: 4px 18px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .footer-note i {
            color: #a67b5b;
            margin: 0 6px;
        }

        /* 响应式 */
        @media (max-width: 820px) {
            .card {
                padding: 34px 24px;
                border-radius: 40px;
            }

            .hobbies-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .student-tag {
                align-self: flex-start;
            }

            .school-name {
                font-size: 22px;
            }

            .hero-image-section img {
                aspect-ratio: 16 / 8;
            }

            .social-links {
                gap: 16px;
            }

            .social-link {
                padding: 8px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 540px) {
            .card {
                padding: 24px 16px;
                border-radius: 32px;
            }

            .hobbies-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .hobby-item {
                padding: 22px 16px;
            }

            .hobby-name {
                font-size: 22px;
            }

            .hero-image-section {
                border-radius: 28px;
            }

            .hero-image-section img {
                aspect-ratio: 16 / 10;
            }

            .social-links {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .social-link {
                justify-content: center;
            }

            .footer-note {
                flex-direction: column;
                gap: 8px;
            }
        }

        .hero-image-section img {
            background: #d2c2b2;
        }

        .hobby-item .hobby-tag {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            background: rgba(160, 130, 100, 0.12);
            padding: 2px 16px;
            border-radius: 60px;
            color: #5a4a3a;
            letter-spacing: 0.3px;
            border: 1px solid rgba(200, 170, 140, 0.15);
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 头部：学校 + 身份 -->
        <header class="header">
            <div class="school-badge">
                <div class="school-name">
                    <i class="fas fa-graduation-cap" style="margin-right: 12px; font-size: 28px; -webkit-text-fill-color: #a67b5b; background: none; color: #a67b5b;"></i>
                    成都石室东部新区实验学校
                </div>
                <div class="school-sub">
                    <i class="fas fa-map-pin" style="margin-right: 6px;"></i> 东部新区 · 学府风华
                </div>
            </div>
            <div class="student-tag">
                <i class="fas fa-user-astronaut"></i>
                学生 · 探索者
            </div>
        </header>

        <!-- 显眼图片区域 -->
        <div class="hero-image-section">
            <img
            src="https://picsum.photos/seed/student/1200/500"
            alt="个人展示图片 · 石室东区"
            title="点击可更换图片 (src 自行替换)"
            />
            <div class="img-fallback-label">
                <i class="fas fa-camera"></i> 图片占位 · 请替换 src
            </div>
        </div>

        <!-- 爱好区域 -->
        <div class="hobbies-title">
            <i class="fas fa-heart" style="color: #b48b6b;"></i>
            我的热爱 · 三个世界
            <span style="font-size: 14px; font-weight: 400; color: #7b6a5a; margin-left: 8px;">
                <i class="fas fa-chevron-right"></i> 探索不止
            </span>
        </div>

        <div class="hobbies-grid">

            <!-- Minecraft -->
            <div class="hobby-item">
                <span class="hobby-icon">
                    <i class="fas fa-cube"></i>
                </span>
                <div class="hobby-name">Minecraft</div>
                <div class="hobby-desc">
                    <i class="fas fa-pickaxe"></i> 方块 · 创造 · 冒险
                </div>
                <div class="hobby-tag">
                    <i class="fas fa-tree"></i> 生存 · 建筑
                </div>
            </div>

            <!-- 终末地 -->
            <div class="hobby-item">
                <span class="hobby-icon">
                    <i class="fas fa-rocket"></i>
                </span>
                <div class="hobby-name">终末地</div>
                <div class="hobby-desc">
                    <i class="fas fa-globe-asia"></i> 科幻 · 策略 · 末世
                </div>
                <div class="hobby-tag">
                    <i class="fas fa-satellite"></i> 明日方舟 · 终末地
                </div>
            </div>

            <!-- 诡秘之主 -->
            <div class="hobby-item">
                <span class="hobby-icon">
                    <i class="fas fa-mask"></i>
                </span>
                <div class="hobby-name">诡秘之主</div>
                <div class="hobby-desc">
                    <i class="fas fa-book-open"></i> 克系 · 神秘 · 序列
                </div>
                <div class="hobby-tag">
                    <i class="fas fa-moon"></i> 愚者 · 非凡世界
                </div>
            </div>

        </div>

        <!-- ===== 社交链接：B站 + CSDN + GitHub (新增) ===== -->
        <div class="social-links">
            <a href="https://space.bilibili.com/3546710731131568" target="_blank" class="social-link" title="访问我的B站主页">
                <i class="fab fa-bilibili"></i>
                <span class="link-label">B站空间</span>
                <span class="link-domain">bilibili.com</span>
            </a>
            <a href="https://blog.csdn.net/2401_89872449" target="_blank" class="social-link" title="访问我的CSDN博客">
                <i class="fas fa-blog"></i>
                <span class="link-label">CSDN博客</span>
                <span class="link-domain">blog.csdn.net</span>
            </a>
            <a href="https://github.com/Dave-bit-spec" target="_blank" class="social-link" title="访问我的GitHub主页">
                <i class="fab fa-github"></i>
                <span class="link-label">GitHub</span>
                <span class="link-domain">github.com</span>
            </a>
        </div>

        <!-- 底部信息 -->
        <div class="footer-note">
            <span>
                <i class="fas fa-school"></i> 成都石室东部新区实验学校
            </span>
            <span>
                <i class="fas fa-user-graduate"></i> 在读学生
            </span>
            <span>
                <i class="fas fa-code"></i> 个人主页 · 2026
            </span>
            <span style="background: none; padding: 0;">
                <i class="fas fa-quote-right" style="color: #b48b6b;"></i>
                热爱即星辰
            </span>
        </div>

    </div>

</body>
</html>
